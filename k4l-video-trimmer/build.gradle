apply plugin: 'com.android.library'
// NOTE: Sonatype publishing (../mavenpush.gradle) used the legacy `maven` plugin,
// which was removed in Gradle 7+. Disabled for the Gradle 9 / AGP 9 upgrade.
// apply from: '../mavenpush.gradle'

android {
    namespace = 'life.knowledge4.videotrimmer'
    compileSdk = 37

    lint {
        abortOnError = false
    }

    defaultConfig {
        minSdk = 21
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.googlecode.mp4parser:isoparser:1.1.20'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.annotation:annotation:1.9.1'
}
